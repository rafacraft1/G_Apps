name: geofence_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API & State Management
  dio: ^5.4.3
  provider: ^6.1.2

  # Local Storage & Device Info
  flutter_secure_storage: ^9.2.1
  device_info_plus: ^10.1.2
  geolocator: ^12.0.0
  camera: ^0.11.0+2
  flutter_image_compress: ^2.3.0
  lottie: ^3.1.3
  shimmer: ^3.0.0
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^6.0.1
  image_picker: ^1.0.0
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.1
  syncfusion_flutter_pdfviewer: 24.2.9
  workmanager: ^0.7.0
  shared_preferences: ^2.2.3
  
  # ✅ TAMBAHAN BARU: Untuk memunculkan Banner Sistem di Foreground
  flutter_local_notifications: ^17.1.2
  
  flutter_native_splash: ^2.4.0 
  flutter_background_service_android: ^6.3.1
  google_mlkit_face_detection: ^0.13.1
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/animations/

flutter_native_splash:
  color: "#1E88E5" 
  android_12:
    color: "#1E88E5"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

dependency_overrides:
  syncfusion_pdfviewer_platform_interface: 24.2.9
  device_info_plus: ^9.1.2
  js: ^0.7.1